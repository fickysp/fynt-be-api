host: localhost:8080
info:
  contact: {}
  description: REST API untuk sistem rekrutmen Fynt (Seeker & Recruiter).
  title: Fynt API
  version: "1.0"
paths:
  /api/v1/auth/exchange:
    post:
      consumes:
      - application/json
      description: Memvalidasi one-time code untuk mendapatkan access token JWT
      parameters:
      - description: Exchange Code Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.DTOExchangeCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Penukaran token berhasil
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.BaseResponse'
        "400":
          description: Format JSON tidak valid
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "401":
          description: Kode penukaran tidak valid atau sudah kadaluwarsa
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
      summary: Exchange OAuth Code
      tags:
      - Auth
  /api/v1/auth/google/callback:
    get:
      description: Memproses callback autentikasi Google
      parameters:
      - description: OAuth state
        in: query
        name: state
        required: true
        type: string
      - description: OAuth authorization code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect after authentication
        "400":
          description: Data state atau role tidak valid
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "401":
          description: User tidak diketahui
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "500":
          description: Gagal memproses profil Google
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "502":
          description: Layanan profil Google tidak tersedia
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
      summary: Google OAuth Callback
      tags:
      - Auth
  /api/v1/auth/google/login:
    get:
      description: Mengarahkan pengguna ke halaman login Google
      parameters:
      - description: User role (seeker/recruiter)
        in: query
        name: role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to Google
        "400":
          description: Role user tidak valid
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "500":
          description: Gagal generate PKCE
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
      summary: Login with Google
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Melakukan login pengguna
      parameters:
      - description: Payload login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.DTOLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login berhasil
          schema:
            $ref: '#/definitions/internal_auth.SwaggerLoginResponse'
        "400":
          description: Format JSON atau data tidak valid
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "401":
          description: Email atau password salah
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "404":
          description: User tidak ditemukan
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
      summary: Login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Mengeluarkan pengguna dari sesi aktif
      produces:
      - application/json
      responses:
        "200":
          description: Logout berhasil
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.BaseResponse'
        "401":
          description: User tidak diketahui / tidak diautentikasi
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "500":
          description: Gagal memproses logout
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /api/v1/auth/register/recruiter:
    post:
      consumes:
      - application/json
      description: Mendaftarkan akun recruiter
      parameters:
      - description: Payload Registrasi Recruiter / Perusahaan
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.DTOCompanyRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Registrasi berhasil
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.BaseResponse'
        "400":
          description: Body request tidak valid
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "409":
          description: Alamat email sudah digunakan
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_fickysp_fynt-be-api_pkg_response.SwaggerErrorResponse'
      summary: Register Recruiter
      tags:
